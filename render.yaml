# Render Blueprint: backend API.
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: skillora-api
    # Docker image = Node API + Cerbos authorization server in one container (see server/Dockerfile)
    runtime: docker
    plan: free
    region: singapore # closest Render region to the Atlas cluster in Mumbai
    rootDir: server # only changes under server/ trigger a deploy
    dockerfilePath: ./server/Dockerfile # repo-root relative
    dockerContext: ./server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://skillora.vercel.app (comma-separate several)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
