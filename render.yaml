# Render Blueprint: backend API.
# Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.
services:
  - type: web
    name: skillora-api
    runtime: node
    plan: free
    region: singapore # closest Render region to the Atlas cluster in Mumbai
    rootDir: server
    # --omit=optional skips mongodb-memory-server (dev/test only, downloads a large binary)
    buildCommand: npm ci --omit=optional
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false # Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://skillora.vercel.app (comma-separate several)
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
