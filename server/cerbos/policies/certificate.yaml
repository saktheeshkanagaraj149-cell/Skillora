# Who can manage and verify certificates.
# Enforced in server/src/courses.js: list_mine on GET /api/me/certificates. Issuing a certificate is checked
# as path:claim_certificate (it depends on the course being published). Public verification
# (GET /api/certificates/:code) intentionally skips Cerbos so it works even when Cerbos is down;
# the verify rule documents that it is public.
# Roles come from User.role (learner | tutor | admin); visitors who are not logged in are "guest".
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: certificate
  rules:
    # Logged-in learners can claim and list their own certificates
    - actions: ["claim", "list_mine"]
      effect: EFFECT_ALLOW
      roles: ["learner", "tutor", "admin"]

    # Anyone can verify a certificate by code (public verification page)
    - actions: ["verify"]
      effect: EFFECT_ALLOW
      roles: ["guest", "learner", "tutor", "admin"]
